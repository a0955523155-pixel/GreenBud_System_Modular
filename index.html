<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠芽團隊 - 企業級不動產管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: '微軟正黑體', sans-serif; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #loginScreen { position: fixed; inset: 0; background: #f3f4f6; z-index: 1000; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
    <div id="loginScreen">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <i class="fas fa-seedling text-4xl text-green-600 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">綠芽團隊系統登入</h2>
            </div>
            <form onsubmit="window.app.login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">帳號 (Email)</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">密碼</label>
                    <input type="password" id="loginPwd" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition">登入系統</button>
            </form>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="text-xl font-bold text-blue-600 flex items-center gap-3"><i class="fas fa-spinner fa-spin"></i> 處理中...</div>
    </div>

    <div class="max-w-7xl mx-auto space-y-6" id="mainContent" style="display: none;">
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-green-600 p-3 rounded-xl"><i class="fas fa-home text-white text-xl"></i></div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">綠芽團隊不動產庫</h1>
                    <p class="text-sm text-gray-500">目前登入：<span id="currentUser" class="font-bold text-green-600"></span></p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="adminLogBtn" onclick="window.app.viewLogs()" class="hidden bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-shield-alt"></i> 系統操作紀錄</button>
                <button onclick="window.app.logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-sign-out-alt"></i> 登出</button>
            </div>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
            <div><label class="text-xs text-gray-500 block mb-1">關鍵字搜尋</label><input type="text" id="filterKeyword" oninput="window.app.renderCases()" placeholder="案名/門牌..." class="w-full border p-2 rounded text-sm outline-none"></div>
            <div><label class="text-xs text-gray-500 block mb-1">區域篩選</label>
                <select id="filterRegion" onchange="window.app.renderCases()" class="w-full border p-2 rounded text-sm outline-none">
                    <option value="">全部區域</option>
                </select>
            </div>
            <div><label class="text-xs text-gray-500 block mb-1">案件屬性(分區)</label>
                <select id="filterZoning" onchange="window.app.renderCases()" class="w-full border p-2 rounded text-sm outline-none">
                    <option value="">全部屬性</option>
                </select>
            </div>
            <div class="col-span-2 flex gap-2 items-end">
                <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">總價區間 (萬)</label><input type="number" id="filterPriceMin" oninput="window.app.renderCases()" placeholder="最低" class="w-full border p-2 rounded text-sm outline-none"></div>
                <span class="mb-2 text-gray-400">-</span>
                <div class="flex-1"><input type="number" id="filterPriceMax" oninput="window.app.renderCases()" placeholder="最高" class="w-full border p-2 rounded text-sm outline-none mb-0"></div>
                <button onclick="window.app.resetFilters()" class="bg-gray-100 px-3 py-2 border rounded text-sm hover:bg-gray-200"><i class="fas fa-redo"></i></button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden sticky top-8">
                    </div>
            </div>
            
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 min-h-[calc(100vh-160px)]">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-xl font-bold text-gray-800">符合條件的案件：<span id="totalCount" class="text-blue-600">0</span> 筆</h2>
                    </div>
                    <div id="casesList" class="grid grid-cols-1 md:grid-cols-2 gap-6 content-start"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="logModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg"><i class="fas fa-list"></i> 系統操作與匯出紀錄</h3>
                <button onclick="document.getElementById('logModal').classList.add('hidden')" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 text-sm" id="logContent"></div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
