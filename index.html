<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠芽團隊 - 企業級不動產管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: '微軟正黑體', sans-serif; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #loginScreen { position: fixed; inset: 0; background: #f3f4f6; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
    <div id="loginScreen">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <i class="fas fa-seedling text-4xl text-green-600 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">綠芽團隊系統登入</h2>
            </div>
            <form onsubmit="window.app.login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">帳號 (Email)</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">密碼</label>
                    <input type="password" id="loginPwd" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition">登入系統</button>
            </form>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="text-xl font-bold text-blue-600 flex items-center gap-3"><i class="fas fa-spinner fa-spin"></i> 處理中...</div>
    </div>

    <div class="max-w-7xl mx-auto space-y-6" id="mainContent" style="display: none;">
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-green-600 p-3 rounded-xl"><i class="fas fa-home text-white text-xl"></i></div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">綠芽團隊不動產庫</h1>
                    <p class="text-sm text-gray-500">目前登入：<span id="currentUser" class="font-bold text-green-600"></span></p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="adminLogBtn" onclick="window.app.viewLogs()" class="hidden bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-shield-alt"></i> 系統操作紀錄</button>
                <button onclick="window.app.logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-sign-out-alt"></i> 登出</button>
            </div>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
            <div><label class="text-xs text-gray-500 block mb-1">關鍵字搜尋</label><input type="text" id="filterKeyword" oninput="window.app.renderCases()" placeholder="案名/門牌..." class="w-full border p-2 rounded text-sm outline-none"></div>
            <div><label class="text-xs text-gray-500 block mb-1">區域篩選</label>
                <select id="filterRegion" onchange="window.app.renderCases()" class="w-full border p-2 rounded text-sm outline-none">
                    <option value="">全部區域</option>
                </select>
            </div>
            <div><label class="text-xs text-gray-500 block mb-1">案件屬性(分區)</label>
                <select id="filterZoning" onchange="window.app.renderCases()" class="w-full border p-2 rounded text-sm outline-none">
                    <option value="">全部屬性</option>
                </select>
            </div>
            <div class="col-span-2 flex gap-2 items-end">
                <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">總價區間 (萬)</label><input type="number" id="filterPriceMin" oninput="window.app.renderCases()" placeholder="最低" class="w-full border p-2 rounded text-sm outline-none"></div>
                <span class="mb-2 text-gray-400">-</span>
                <div class="flex-1"><input type="number" id="filterPriceMax" oninput="window.app.renderCases()" placeholder="最高" class="w-full border p-2 rounded text-sm outline-none mb-0"></div>
                <button onclick="window.app.resetFilters()" class="bg-gray-100 px-3 py-2 border rounded text-sm hover:bg-gray-200"><i class="fas fa-redo"></i></button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden sticky top-8">
                    <div id="formHeader" class="p-5 border-b flex justify-between items-center bg-blue-50/50 border-blue-100">
                        <h2 class="text-lg font-bold flex items-center gap-2 text-blue-900" id="formTitle">
                            <i class="fas fa-plus"></i> 新增案件資料
                        </h2>
                        <button id="cancelEditBtn" onclick="window.app.cancelEdit()" class="hidden text-sm text-gray-500 hover:text-gray-700 bg-white px-2 py-1 rounded border border-gray-200">
                            取消編輯
                        </button>
                    </div>
                    
                    <form id="caseForm" onsubmit="window.app.saveCase(event)" class="p-5 space-y-6 max-h-[calc(100vh-200px)] overflow-y-auto">
                        <input type="hidden" id="editId">
                        
                        <div class="space-y-4">
                            <h3 class="text-sm font-semibold text-gray-900 border-b pb-2 flex items-center gap-2"><i class="fas fa-file-alt text-blue-500"></i> 基本資料</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">案名 <span class="text-red-500">*</span></label><input type="text" id="c_name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:border-blue-500"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">進件日期</label><input type="date" id="c_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">專員</label><input type="text" id="c_agent" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">區域</label><input type="text" id="c_region" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">門牌號碼</label><input type="text" id="c_address" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-sm font-semibold text-gray-900 border-b pb-2 flex items-center gap-2"><i class="fas fa-map-marker-alt text-blue-500"></i> 土地與建物資訊</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">地籍資料</label><input type="text" id="c_cadastral" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">分區</label><input type="text" id="c_zoning" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">使用狀況</label><input type="text" id="c_status" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">地坪 (坪)</label><input type="number" step="0.01" id="c_landArea" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">建坪 (坪)</label><input type="number" step="0.01" id="c_buildArea" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">面寬 (米)</label><input type="number" step="0.01" id="c_width" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">縱深 (米)</label><input type="number" step="0.01" id="c_depth" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">建照號碼</label><input type="text" id="c_buildLicense" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div class="col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">使照號碼</label><input type="text" id="c_useLicense" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-sm font-semibold text-gray-900 border-b pb-2">價格資訊</h3>
                            <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">土地單價 (萬)</label><input type="number" step="0.01" id="c_unitPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">總價 (萬)</label><input type="number" step="0.01" id="c_totalPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none font-bold text-red-600"></div>
                            </div>
                        </div>

                        <div><label class="block text-sm font-medium text-gray-700 mb-1">備註</label><textarea id="c_notes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none resize-none"></textarea></div>

                        <div class="space-y-5 border-t pt-4">
                            <div id="existingFilesContainer"></div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-image"></i> 照片上傳 (可多選)</label>
                                <input type="file" id="c_photos" accept="image/*" multiple class="w-full text-sm border p-2 rounded-lg bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-file-pdf"></i> PDF 上傳 (可多選)</label>
                                <input type="file" id="c_pdfs" accept="application/pdf" multiple class="w-full text-sm border p-2 rounded-lg bg-gray-50">
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all bg-blue-600 hover:bg-blue-700">
                            <i class="fas fa-save"></i> 儲存並新增至總表
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 min-h-[calc(100vh-160px)]">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-xl font-bold text-gray-800">符合條件的案件：<span id="totalCount" class="text-blue-600">0</span> 筆</h2>
                    </div>
                    <div id="casesList" class="grid grid-cols-1 md:grid-cols-2 gap-6 content-start"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="logModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg"><i class="fas fa-list"></i> 系統操作與匯出紀錄</h3>
                <button onclick="document.getElementById('logModal').classList.add('hidden')" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 text-sm" id="logContent"></div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
