<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠芽團隊 - 企業級不動產管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: '微軟正黑體', sans-serif; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #loginScreen { position: fixed; inset: 0; background: #f3f4f6; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 分頁切換樣式 */
        .page-view { display: none; }
        .page-view.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { border-color: #16a34a; color: #16a34a; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800 relative">
    <div id="loginScreen">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
            <div class="text-center mb-6">
                <i class="fas fa-seedling text-4xl text-green-600 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">綠芽團隊系統登入</h2>
            </div>
            <form onsubmit="window.app.login(event)" class="space-y-4">
                <div><label class="block text-sm text-gray-600 mb-1">帳號 (Email)</label><input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-green-500"></div>
                <div><label class="block text-sm text-gray-600 mb-1">密碼</label><input type="password" id="loginPwd" required class="w-full px-4 py-2 border rounded-lg outline-none focus:border-green-500"></div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition">登入系統</button>
            </form>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="text-xl font-bold text-blue-600 flex items-center gap-3"><i class="fas fa-spinner fa-spin"></i> 處理中...</div>
    </div>

    <div class="max-w-7xl mx-auto space-y-6" id="mainContent" style="display: none;">
        <header class="bg-white px-6 pt-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-green-600 p-3 rounded-xl"><i class="fas fa-leaf text-white text-xl"></i></div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">綠芽團隊不動產庫</h1>
                        <p class="text-sm text-gray-500">目前登入：<span id="currentUser" class="font-bold text-green-600"></span></p>
                    </div>
                </div>
                <div>
                    <button onclick="window.app.logout()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-sign-out-alt"></i> 登出系統</button>
                </div>
            </div>
            
            <nav class="flex gap-6 mt-2" id="navTabs">
                <button class="tab-btn active pb-3 px-2 text-gray-600 hover:text-green-600" onclick="window.app.switchPage('form')"><i class="fas fa-plus-circle"></i> 新增/編輯案件</button>
                <button class="tab-btn pb-3 px-2 text-gray-600 hover:text-green-600" onclick="window.app.switchPage('list')"><i class="fas fa-list"></i> 案件總表與篩選</button>
                <button class="tab-btn hidden pb-3 px-2 text-gray-600 hover:text-green-600" id="nav-log-btn" onclick="window.app.switchPage('log')"><i class="fas fa-shield-alt"></i> 系統活動紀錄</button>
            </nav>
        </header>

        <div id="page-form" class="page-view active">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden max-w-4xl mx-auto">
                <div id="formHeader" class="p-5 border-b flex justify-between items-center bg-green-50/50 border-green-100">
                    <h2 class="text-xl font-bold flex items-center gap-2 text-green-900" id="formTitle"><i class="fas fa-plus"></i> 新增案件資料</h2>
                    <button id="cancelEditBtn" onclick="window.app.cancelEdit()" class="hidden text-sm text-red-500 hover:text-red-700 font-bold bg-white px-3 py-1 rounded border border-red-200">取消編輯</button>
                </div>
                
                <form id="caseForm" onsubmit="window.app.saveCase(event)" class="p-6 md:p-8 space-y-6">
                    <input type="hidden" id="editId">
                    
                    <div class="space-y-4">
                        <h3 class="text-md font-bold text-gray-800 border-b pb-2 text-green-700"><i class="fas fa-file-alt"></i> 基本資料</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">案名 <span class="text-red-500">*</span></label><input type="text" id="c_name" required class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">進件日期</label><input type="date" id="c_date" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">專員</label><input type="text" id="c_agent" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-gray-50"></div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">縣市 <span class="text-red-500">*</span></label>
                                <select id="c_city" required onchange="window.app.onCityChange()" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-white">
                                    <option value="">請選擇縣市</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">鄉鎮市區 <span class="text-red-500">*</span></label>
                                <select id="c_district" required class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-white">
                                    <option value="">請先選擇縣市</option>
                                </select>
                            </div>
                            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">門牌號碼</label><input type="text" id="c_address" placeholder="請填寫完整地址" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-gray-50"></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-md font-bold text-gray-800 border-b pb-2 text-green-700"><i class="fas fa-map-marker-alt"></i> 土地與建物資訊</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">地籍資料</label><input type="text" id="c_cadastral" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-gray-50"></div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">案件屬性/分區</label>
                                <select id="c_zoning" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-green-500 bg-white">
                                    </select>
                            </div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">使用狀況</label><input type="text" id="c_status" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">地坪 (坪)</label><input type="number" step="0.01" id="c_landArea" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">建坪 (坪)</label><input type="number" step="0.01" id="c_buildArea" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">面寬 (米)</label><input type="number" step="0.01" id="c_width" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">縱深 (米)</label><input type="number" step="0.01" id="c_depth" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">建照號碼</label><input type="text" id="c_buildLicense" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                            <div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">使照號碼</label><input type="text" id="c_useLicense" class="w-full px-3 py-2 border rounded-lg outline-none bg-gray-50"></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-md font-bold text-gray-800 border-b pb-2 text-green-700"><i class="fas fa-dollar-sign"></i> 價格資訊</h3>
                        <div class="grid grid-cols-2 gap-4 bg-green-50/30 p-4 rounded-xl border border-green-100">
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">土地單價 (萬)</label><input type="number" step="0.01" id="c_unitPrice" class="w-full px-3 py-2 border rounded-lg outline-none bg-white"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">總價 (萬)</label><input type="number" step="0.01" id="c_totalPrice" class="w-full px-3 py-2 border rounded-lg outline-none font-bold text-red-600 bg-white"></div>
                        </div>
                    </div>

                    <div><label class="block text-sm font-medium text-gray-700 mb-1">備註</label><textarea id="c_notes" rows="3" class="w-full px-3 py-2 border rounded-lg outline-none resize-none bg-gray-50"></textarea></div>

                    <div class="space-y-5 border-t pt-4">
                        <div id="existingFilesContainer"></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-image"></i> 上傳照片 (可多選)</label><input type="file" id="c_photos" accept="image/*" multiple class="w-full text-sm border p-2 rounded-lg bg-gray-50"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-file-pdf"></i> 上傳 PDF (可多選)</label><input type="file" id="c_pdfs" accept="application/pdf" multiple class="w-full text-sm border p-2 rounded-lg bg-gray-50"></div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full text-white font-bold py-3 px-4 rounded-xl shadow transition-all bg-green-600 hover:bg-green-700 text-lg">
                        <i class="fas fa-save"></i> 儲存並送出案件
                    </button>
                </form>
            </div>
        </div>

        <div id="page-list" class="page-view">
            <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                    <div class="md:col-span-3"><label class="text-xs text-gray-500 block mb-1">關鍵字搜尋</label><input type="text" id="filterKeyword" oninput="window.app.renderCases()" placeholder="搜尋案名、門牌、專員..." class="w-full border p-2 rounded-lg text-sm outline-none bg-gray-50"></div>
                    <div class="md:col-span-3"><label class="text-xs text-gray-500 block mb-1">區域篩選 (先選縣市再勾區域)</label>
                        <button onclick="window.app.openRegionModal()" class="w-full border p-2 rounded-lg text-sm bg-white hover:bg-gray-50 text-left flex justify-between items-center truncate">
                            <span id="selectedRegionText" class="truncate text-gray-700">全部縣市/區域</span><i class="fas fa-chevron-down text-gray-400"></i>
                        </button>
                    </div>
                    <div class="md:col-span-3"><label class="text-xs text-gray-500 block mb-1">案件屬性/分區 (可多選)</label>
                        <button onclick="window.app.openZoningModal()" class="w-full border p-2 rounded-lg text-sm bg-white hover:bg-gray-50 text-left flex justify-between items-center truncate">
                            <span id="selectedZoningText" class="truncate text-gray-700">全部類型/分區</span><i class="fas fa-chevron-down text-gray-400"></i>
                        </button>
                    </div>
                    <div class="md:col-span-3">
                        <label class="text-xs text-gray-500 block mb-1">總價區間 (萬)</label>
                        <div class="flex gap-1 items-center">
                            <input type="number" id="filterPriceMin" oninput="window.app.renderCases()" placeholder="最低" class="w-full border p-2 rounded-lg text-sm outline-none bg-gray-50">
                            <span class="text-gray-400">-</span>
                            <input type="number" id="filterPriceMax" oninput="window.app.renderCases()" placeholder="最高" class="w-full border p-2 rounded-lg text-sm outline-none bg-gray-50">
                            <button onclick="window.app.resetFilters()" class="bg-gray-200 text-gray-700 p-2 border rounded-lg text-sm hover:bg-gray-300 ml-1" title="重置"><i class="fas fa-redo"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div class="flex flex-wrap justify-between items-center mb-6 border-b pb-4 gap-4">
                    <h2 class="text-xl font-bold text-gray-800">符合條件的案件：<span id="totalCount" class="text-green-600">0</span> 筆</h2>
                    <div class="flex gap-2">
                        <button onclick="window.app.exportToExcel()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-2"><i class="fas fa-file-excel"></i> 匯出總表 Excel</button>
                        <button onclick="window.app.exportToPDF()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-2"><i class="fas fa-file-pdf"></i> 匯出總表 PDF</button>
                    </div>
                </div>
                <div id="casesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 content-start"></div>
            </div>
        </div>

        <div id="page-log" class="page-view">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-4 border-b pb-4">
                    <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-shield-alt text-gray-600"></i> 系統操作與匯出紀錄</h2>
                    <button onclick="window.app.loadLogs()" class="text-sm bg-gray-100 px-3 py-1 rounded hover:bg-gray-200"><i class="fas fa-sync-alt"></i> 重新整理</button>
                </div>
                <div class="overflow-y-auto max-h-[60vh] text-sm" id="logContent">
                    <div class="text-center py-10 text-gray-400">請點擊上方重新整理載入紀錄</div>
                </div>
            </div>
        </div>

    </div>

    <div id="regionModal" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl h-[70vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800"><i class="fas fa-map-marked-alt text-green-600"></i> 請勾選要篩選的區域</h3>
                <button onclick="window.app.closeRegionModal()" class="text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div class="w-1/3 border-r bg-gray-50 overflow-y-auto" id="cityTabList"></div>
                <div class="w-2/3 p-4 overflow-y-auto bg-white" id="districtCheckboxList">
                    <div class="text-center text-gray-400 mt-10">請先從左側選擇縣市</div>
                </div>
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                <button onclick="window.app.clearSelectedRegions()" class="text-sm text-red-500 font-semibold hover:underline">清除所有勾選</button>
                <button onclick="window.app.confirmRegionSelection()" class="bg-green-600 text-white px-8 py-2 rounded-xl font-bold hover:bg-green-700 shadow">確定篩選</button>
            </div>
        </div>
    </div>

    <div id="zoningModal" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl max-h-[85vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800"><i class="fas fa-tags text-blue-600"></i> 請勾選案件屬性 / 分區</h3>
                <button onclick="window.app.closeZoningModal()" class="text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 text-sm space-y-4" id="zoningModalBody"></div>
            <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
                <button onclick="window.app.clearSelectedZonings()" class="text-sm text-red-500 font-semibold hover:underline">清除全選</button>
                <button onclick="window.app.confirmZoningSelection()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold hover:bg-blue-700 shadow">確定篩選</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
